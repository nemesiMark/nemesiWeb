<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Area riservata · Nemesi Web</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17171C">
<link rel="icon" href="images/logo/favicon-32.png?v=2.2" type="image/png" sizes="32x32">
<link rel="icon" href="images/logo/favicon-16.png?v=2.2" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="images/logo/favicon-180.png?v=2.2">
<style>
/* pagina segnaposto: l'area riservata vera arriverà più avanti */
@font-face{ font-family:"Inter Tight"; src:url(fonts/inter-tight.woff2) format("woff2"); font-weight:500 900; font-display:swap; }
@font-face{ font-family:"Geist"; src:url(fonts/geist.woff2) format("woff2"); font-weight:100 900; font-display:swap; }
@font-face{ font-family:"Geist Mono"; src:url(fonts/geist-mono.woff2) format("woff2"); font-weight:100 900; font-display:swap; }
:root{ --nero:#17171C; --bianco:#F4F3F1; --fumo:#A4A4AE; --arancio-chiaro:#FFA54D; --arancio-scuro:#EA4006; }
*{ box-sizing:border-box; margin:0; padding:0; }
html, body{ background:var(--nero); color:var(--bianco); }
body{ min-height:100vh; min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
  padding:40px 20px; font-family:"Geist", -apple-system, "Helvetica Neue", Arial, sans-serif; text-align:center;
  -webkit-font-smoothing:antialiased;
  background:radial-gradient(ellipse 60% 45% at 50% 50%, rgba(245,111,39,.10), rgba(245,111,39,0)) var(--nero); }
a{ color:inherit; text-decoration:none; }
.logo img{ display:block; height:47px; width:auto; }
.kicker{ display:flex; align-items:center; justify-content:center; gap:12px; color:var(--fumo);
  font-family:"Geist Mono", ui-monospace, Menlo, monospace; font-size:12.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; }
.kicker::before{ content:""; width:30px; height:1px; background:linear-gradient(90deg, var(--arancio-scuro), var(--arancio-chiaro)); }
h1{ font-family:"Inter Tight", "Geist", Arial, sans-serif; font-weight:800; font-size:clamp(34px, 5vw, 58px); line-height:1.02; letter-spacing:-.02em; }
h1 em{ font-style:normal; color:var(--arancio-chiaro); }
.torna{ display:inline-flex; align-items:center; height:44px; padding:0 18px; border-radius:11px; background:#000; color:#F4F3F1; font-size:14px; font-weight:500;
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset; transition:box-shadow 220ms ease, transform 220ms ease; }
.torna:hover, .torna:focus-visible{ outline:none; transform:translateY(-2px);
  box-shadow:0 0 0 1px rgba(255,170,90,.6), 0 0 10px rgba(245,111,39,.55), 0 0 24px rgba(245,111,39,.25), inset 0 0 8px rgba(245,111,39,.22); }
</style>
</head>
<body>
  <a class="logo" href="./" aria-label="Nemesi Web, torna al sito"><img src="images/logo/nemesi-web-nav.png" alt="" width="447" height="114"></a>
  <p class="kicker">Area riservata</p>
  <h1>Presto qui<br><em>i tuoi progetti.</em></h1>
  <a class="torna" href="./">Torna al sito</a>
</body>
</html>
